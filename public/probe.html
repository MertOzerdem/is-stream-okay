<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stream probe</title></head>
  <body>
    <div id="twitch-player"></div>
    <script>
      (() => {
        const parameters = new URLSearchParams(location.search);
        const channel = parameters.get('channel');
        const parents = [...new Set(parameters.getAll('parent').filter(Boolean))];
        const probe = { embedReady: false, playerReady: false, online: false, offline: false, playing: false, stats: null, qualities: [], qualitySelection: null, error: null };
        window.__streamProbe = { snapshot: probe };
        const script = document.createElement('script');
        script.src = 'https://embed.twitch.tv/embed/v1.js';
        script.onerror = () => { probe.error = 'Twitch Embed API failed to load.'; };
        script.onload = () => {
          const embed = new Twitch.Embed('twitch-player', {
            channel,
            width: 800,
            height: 450,
            layout: 'video',
            autoplay: true,
            muted: true,
            parent: parents.length ? parents : [location.hostname],
          });
          window.__twitchEmbed = embed;
          probe.embedReady = true;
          embed.addEventListener(Twitch.Embed.VIDEO_READY, () => {
            const player = embed.getPlayer();
            window.__twitchPlayer = player;
            probe.playerReady = true;
            embed.addEventListener(Twitch.Player.ONLINE, () => { probe.online = true; probe.offline = false; });
            embed.addEventListener(Twitch.Player.OFFLINE, () => { probe.offline = true; probe.online = false; });
            embed.addEventListener(Twitch.Embed.VIDEO_PLAY, () => { probe.playing = true; probe.online = true; });
            embed.addEventListener(Twitch.Player.PLAYBACK_BLOCKED, () => { probe.error = 'Twitch playback was blocked.'; });
          });
        };
        document.head.appendChild(script);
        setInterval(() => {
          try {
            const player = window.__twitchPlayer;
            if (player) {
              probe.stats = player.getPlaybackStats();
              probe.qualities = player.getQualities()
                .map((quality) => typeof quality === 'string' ? quality : quality?.name)
                .filter((quality) => quality && quality.toLowerCase() !== 'auto');
              const qualitySelection = probe.qualitySelection;
              const preferredQuality = probe.qualities.find((quality) => /^1080(?:p\d*)?(?:\s|$)/i.test(quality.trim()))
                || probe.qualities.find((quality) => quality.toLowerCase() === 'chunked' || /\bsource\b/i.test(quality));
              if (preferredQuality && !qualitySelection) {
                probe.qualitySelection = { requested: preferredQuality, selected: null, status: 'requested' };
                try {
                  player.setQuality(preferredQuality);
                } catch (error) {
                  probe.qualitySelection.status = 'failed';
                  probe.qualitySelection.error = error.message;
                }
              }
              if (probe.qualitySelection && probe.qualitySelection.status !== 'failed') {
                probe.qualitySelection.selected = player.getQuality();
                probe.qualitySelection.status = probe.qualitySelection.selected === probe.qualitySelection.requested
                  ? 'selected'
                  : 'pending';
              }
              if (player.getEnded()) {
                probe.offline = true;
                probe.online = false;
              }
            }
          } catch (error) {
            probe.error = error.message;
          }
        }, 1000);
        window.addEventListener('error', (event) => { probe.error = event.message; });
      })();
    </script>
  </body>
</html>
